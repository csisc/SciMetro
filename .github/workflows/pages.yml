name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - src/**
      - studies/**
      - scripts/**
      - tests/**
      - package.json
      - package-lock.json
      - bun.lock
      - vite.config.ts
      - tsconfig*.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            package.json

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Type-check
        run: npm run lint

      - name: Unit tests (indicator definitions)
        run: npm test

      - name: Build site
        env:
          STUDIES_DIR: studies
        run: |
          if [ -f scripts/build_site.py ]; then
            python3 -m pip install markdown
            python3 scripts/build_site.py
          else
            # Fallback: plain Vite build (relative base, tsc already ran in the lint step)
            npx vite build --outDir _site
            if [ -d studies ]; then cp -r studies _site/studies; fi
          fi

      - name: Verify build output
        run: |
          test -f _site/index.html
          grep -q 'src="\./' _site/index.html  # relative asset URLs (project-site safe)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
